version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aire-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_this_to_a_secure_random_32_byte_secret_in_prod}
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - COOKIE_SECURE=false
    volumes:
      - aire-data:/app/ml_pipeline/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_ML_BACKEND_URL=/api
        - VITE_USE_MOCK_AQI=false
    container_name: aire-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  aire-data:
    driver: local
